name: pw-starter
services:
  aotgen:
    build:
      context: ..
      dockerfile: docker/aotgen.Dockerfile
#      args:
#        JAR_FILE: pw-backend-starter-1.0.0.jar
    environment:
      AOT_DIR: /cache
    volumes:
      - ./cache:/cache
    # run once to produce ./cache/app.aot and exit
    restart: "no"

  aot-cache:
    build:
      context: ..
      dockerfile: docker/deploy.Dockerfile
    environment:
      AOT_DIR: /cache
    volumes:
      - ./cache:/cache
    depends_on:
      aotgen:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "8070:8070"

  basic:
    build:
      context: ..
      dockerfile: docker/basic.Dockerfile
    depends_on:
      aot-cache:
        condition: service_started
    ports:
      - "8082:8080"
      - "8072:8070"

  layers:
    build:
      context: ..
      dockerfile: docker/layer.Dockerfile
    depends_on:
      basic:
        condition: service_started
    ports:
      - "8081:8080"
      - "8071:8070"

