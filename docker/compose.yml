name: internal-cache
services:
  layers:
    build:
      context: ..
      dockerfile: docker/layer.Dockerfile
    ports:
      - "8080:8080"
      - "8070:8070"

  basic:
    build:
      context: ..
      dockerfile: docker/basic.Dockerfile
    ports:
      - "8081:8080"
      - "8071:8070"

  plain:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8082:8080"
      - "8072:8070"
