azure.backend.url= https://pw2024.azurewebsites.net

## MULTIPART (MultipartProperties)
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

# Actuator
management.endpoints.access.default=none
management.endpoint.health.access=read_only
management.endpoint.loggers.access=read_only
management.endpoint.beans.access=read_only
management.endpoint.shutdown.access=read_only
management.endpoint.startup.access=read_only
management.endpoint.threaddump.access=read_only
management.endpoint.heapdump.access=read_only
# http://localhost:8080/actuator/env/spring.profiles.active
management.endpoint.env.access=read_only
management.endpoints.web.exposure.include=health,loggers,beans,env,shutdown,startup,threaddump,heapdump

# Loggers
logging.level.root=INFO
logging.level.pw.react.backend=INFO
logging.level.org.springframework.boot.autoconfigure=ERROR

# CORS
cors.urls=${cors:http://localhost:8080,http://localhost:5000}
cors.mappings=/**

# spring-doc
application.springdoc.title=Backend PW API
application.springdoc.description=Backend starter for PW project.
application.springdoc.version=@project.version@
springdoc.show-actuator=true